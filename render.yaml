services:
  - type: web
    name: contentpost-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: contentpost-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://contentpost-frontend.onrender.com
      - key: SCHEDULER_ENABLED
        value: true
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false

  - type: web
    name: contentpost-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://contentpostautomationapp-server.onrender.com/api/v1

databases:
  - name: contentpost-db
    plan: free
